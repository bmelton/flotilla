name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -W error -m unittest discover -s tests -v
      - name: Tag must match the version in the plugin header
        run: |
          v=$(sed -n 's/^# version = "\(.*\)"/\1/p' src/flotilla.py)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "header says $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - run: cp src/flotilla.py "flotilla-${GITHUB_REF_NAME#v}_any.py"  # Orca Cloud wants an OS suffix; "any" = universal
      - uses: softprops/action-gh-release@v2
        with:
          files: flotilla-*_any.py
          generate_release_notes: true
